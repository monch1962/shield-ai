<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#0A1625"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="400" height="500" fill="url(#bg)" rx="12"/>

  <!-- Shield hexagon -->
  <polygon points="200,100 285,155 285,265 200,325 115,265 115,155"
           fill="none" stroke="#2A6A8A" stroke-width="3" stroke-linejoin="round" filter="url(#sg)"/>
  <polygon points="200,112 272,161 272,259 200,313 128,259 128,161"
           fill="none" stroke="#1A4A6A" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4,3"/>

  <!-- Cross connections -->
  <line x1="115" y1="155" x2="285" y2="155" stroke="#D4A843" stroke-width="1.5" opacity="0.5"/>
  <line x1="115" y1="265" x2="285" y2="265" stroke="#D4A843" stroke-width="1.5" opacity="0.5"/>
  <line x1="200" y1="100" x2="200" y2="325" stroke="#D4A843" stroke-width="1.5" opacity="0.3"/>
  <line x1="115" y1="155" x2="285" y2="265" stroke="#1A7A7A" stroke-width="1.5" opacity="0.4"/>
  <line x1="285" y1="155" x2="115" y2="265" stroke="#1A7A7A" stroke-width="1.5" opacity="0.4"/>
  <line x1="115" y1="155" x2="200" y2="325" stroke="#1A7A7A" stroke-width="1" opacity="0.25"/>
  <line x1="285" y1="155" x2="200" y2="325" stroke="#1A7A7A" stroke-width="1" opacity="0.25"/>

  <!-- Inner S -->
  <path d="M 125,170 C 155,140 200,120 240,150 C 270,170 270,210 240,230 C 200,250 175,270 160,290 C 145,310 155,310 170,305"
        fill="none" stroke="#D4A843" stroke-width="2.5" stroke-linecap="round" filter="url(#g)"/>

  <!-- 6 nodes -->
  <circle cx="200" cy="100" r="8" fill="#0D1B2A" stroke="#D4A843" stroke-width="2.5" filter="url(#g)"/>
  <circle cx="285" cy="155" r="7" fill="#0D1B2A" stroke="#1A7A7A" stroke-width="2"/>
  <circle cx="285" cy="265" r="7" fill="#0D1B2A" stroke="#1A7A7A" stroke-width="2"/>
  <circle cx="200" cy="325" r="7" fill="#0D1B2A" stroke="#1A7A7A" stroke-width="2"/>
  <circle cx="115" cy="265" r="7" fill="#0D1B2A" stroke="#1A7A7A" stroke-width="2"/>
  <circle cx="115" cy="155" r="7" fill="#0D1B2A" stroke="#1A7A7A" stroke-width="2"/>
  <circle cx="200" cy="100" r="2.5" fill="#D4A843" filter="url(#g)"/>
  <circle cx="285" cy="155" r="2" fill="#1A7A7A"/>
  <circle cx="285" cy="265" r="2" fill="#1A7A7A"/>
  <circle cx="200" cy="325" r="2" fill="#1A7A7A"/>
  <circle cx="115" cy="265" r="2" fill="#1A7A7A"/>
  <circle cx="115" cy="155" r="2" fill="#1A7A7A"/>

  <!-- SHIELD text -->
  <text x="200" y="400"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="48" font-weight="700" letter-spacing="6"
        fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">
    SHIELD
  </text>

  <!-- -AI -->
  <text x="284" y="400"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="48" font-weight="700" letter-spacing="3"
        fill="#4AB0B0" text-anchor="start" dominant-baseline="middle">
    -AI
  </text>

  <!-- TM -->
  <text x="340" y="382"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="14" font-weight="400"
        fill="#D4A843" text-anchor="start" dominant-baseline="middle">
    ™
  </text>

  <!-- Tagline -->
  <text x="200" y="435"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="10" font-weight="500" letter-spacing="4"
        fill="#6A7A90" text-anchor="middle" dominant-baseline="middle">
    SOVEREIGN AUSTRALIAN AI SECURITY FRAMEWORK
  </text>
</svg>
