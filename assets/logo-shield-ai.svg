<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1F3F"/>
      <stop offset="100%" stop-color="#0D2B4F"/>
    </linearGradient>

    <!-- Glow filter for active nodes -->
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft outer glow for the shield -->
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background (optional — for light-mode contexts we keep it transparent) -->

  <!-- ============================================================ -->
  <!-- SHIELD / HEXAGON OUTLINE                                       -->
  <!-- 6 vertices = 6 pillars. Flat-ish top, point at bottom.        -->
  <!-- ============================================================ -->
  <polygon points="200,100 285,155 285,265 200,325 115,265 115,155"
           fill="none"
           stroke="#1A5A7A"
           stroke-width="3"
           stroke-linejoin="round"
           filter="url(#shieldGlow)"/>

  <!-- Inner hexagon (secondary stroke, creates depth) -->
  <polygon points="200,112 272,161 272,259 200,313 128,259 128,161"
           fill="none"
           stroke="#0F3A5A"
           stroke-width="1.5"
           stroke-linejoin="round"
           stroke-dasharray="4,3"/>

  <!-- ============================================================ -->
  <!-- CONNECTION LINES (the network / agentic AI motif)              -->
  <!-- ============================================================ -->

  <!-- Outer perimeter connections (already the hexagon) -->

  <!-- Cross connections — inner network -->
  <line x1="115" y1="155" x2="285" y2="155" stroke="#D4A843" stroke-width="1.5" opacity="0.6"/>
  <line x1="115" y1="265" x2="285" y2="265" stroke="#D4A843" stroke-width="1.5" opacity="0.6"/>
  <line x1="200" y1="100" x2="200" y2="325" stroke="#D4A843" stroke-width="1.5" opacity="0.4"/>

  <!-- Diagonal network connections -->
  <line x1="115" y1="155" x2="285" y2="265" stroke="#1A7A7A" stroke-width="1.5" opacity="0.5"/>
  <line x1="285" y1="155" x2="115" y2="265" stroke="#1A7A7A" stroke-width="1.5" opacity="0.5"/>
  <line x1="115" y1="155" x2="200" y2="325" stroke="#1A7A7A" stroke-width="1" opacity="0.3"/>
  <line x1="285" y1="155" x2="200" y2="325" stroke="#1A7A7A" stroke-width="1" opacity="0.3"/>

  <!-- ============================================================ -->
  <!-- INNER 'S' — Stylised pathway (shield + Southern Cross nod)    -->
  <!-- ============================================================ -->
  <!-- The 'S' weaves through the inner hexagon, starting top-left,
       arcing through centre, and exiting bottom-left. -->
  <path d="M 125,170
           C 155,140 200,120 240,150
           C 270,170 270,210 240,230
           C 200,250 175,270 160,290
           C 145,310 155,310 170,305"
        fill="none"
        stroke="#D4A843"
        stroke-width="2.5"
        stroke-linecap="round"
        filter="url(#nodeGlow)"/>

  <!-- ============================================================ -->
  <!-- THE 6 NODES (one per pillar)                                  -->
  <!-- ============================================================ -->
  <!-- N1: Top (cyber/executive — Governance)                        -->
  <circle cx="200" cy="100" r="8" fill="#0A1F3F" stroke="#D4A843" stroke-width="2.5" filter="url(#nodeGlow)"/>

  <!-- N2: Upper-right (Model Security)                              -->
  <circle cx="285" cy="155" r="7" fill="#0A1F3F" stroke="#1A7A7A" stroke-width="2"/>

  <!-- N3: Mid-right (Identity & Access)                             -->
  <circle cx="285" cy="265" r="7" fill="#0A1F3F" stroke="#1A7A7A" stroke-width="2"/>

  <!-- N4: Bottom (Tool & Pipeline Security)                         -->
  <circle cx="200" cy="325" r="7" fill="#0A1F3F" stroke="#1A7A7A" stroke-width="2"/>

  <!-- N5: Mid-left (Data Security)                                  -->
  <circle cx="115" cy="265" r="7" fill="#0A1F3F" stroke="#1A7A7A" stroke-width="2"/>

  <!-- N6: Upper-left (Monitoring & Incident Response)               -->
  <circle cx="115" cy="155" r="7" fill="#0A1F3F" stroke="#1A7A7A" stroke-width="2"/>

  <!-- Node centre dots -->
  <circle cx="200" cy="100" r="2.5" fill="#D4A843" filter="url(#nodeGlow)"/>
  <circle cx="285" cy="155" r="2" fill="#1A7A7A"/>
  <circle cx="285" cy="265" r="2" fill="#1A7A7A"/>
  <circle cx="200" cy="325" r="2" fill="#1A7A7A"/>
  <circle cx="115" cy="265" r="2" fill="#1A7A7A"/>
  <circle cx="115" cy="155" r="2" fill="#1A7A7A"/>

  <!-- ============================================================ -->
  <!-- BRAND TEXT                                                     -->
  <!-- ============================================================ -->

  <!-- "SHIELD" -->
  <text x="200" y="400"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="48"
        font-weight="700"
        letter-spacing="6"
        fill="#0A1F3F"
        text-anchor="middle"
        dominant-baseline="middle">
    SHIELD
  </text>

  <!-- "-AI" -->
  <text x="284" y="400"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="48"
        font-weight="700"
        letter-spacing="3"
        fill="#1A7A7A"
        text-anchor="start"
        dominant-baseline="middle">
    -AI
  </text>

  <!-- TM superscript -->
  <text x="340" y="382"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="14"
        font-weight="400"
        fill="#D4A843"
        text-anchor="start"
        dominant-baseline="middle">
    ™
  </text>

  <!-- Tagline -->
  <text x="200" y="435"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="10"
        font-weight="500"
        letter-spacing="4"
        fill="#8A9AB0"
        text-anchor="middle"
        dominant-baseline="middle">
    SOVEREIGN AUSTRALIAN AI SECURITY FRAMEWORK
  </text>

  <!-- 6 small labels inside the hexagon (pillar codes) — subtle -->
  <text x="200" y="195" font-family="monospace" font-size="6.5" fill="#D4A843" opacity="0.4" text-anchor="middle">GRM</text>
  <text x="248" y="205" font-family="monospace" font-size="6.5" fill="#1A7A7A" opacity="0.35" text-anchor="middle">MS</text>
  <text x="248" y="270" font-family="monospace" font-size="6.5" fill="#1A7A7A" opacity="0.35" text-anchor="middle">IAM</text>
  <text x="200" y="300" font-family="monospace" font-size="6.5" fill="#1A7A7A" opacity="0.35" text-anchor="middle">TP</text>
  <text x="152" y="270" font-family="monospace" font-size="6.5" fill="#1A7A7A" opacity="0.35" text-anchor="middle">DS</text>
  <text x="152" y="205" font-family="monospace" font-size="6.5" fill="#1A7A7A" opacity="0.35" text-anchor="middle">MIR</text>

</svg>
