<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 590" width="100%" height="100%">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .title { font-size: 16px; font-weight: bold; fill: #0a1e3d; }
    .label { font-size: 12px; fill: #1a1a2e; }
    .sm { font-size: 10px; fill: #5a6a8a; }
    .gold { fill: #d4a017; }
    .red { fill: #ef4444; }
    .white { fill: #ffffff; }
    .cap { font-size: 9px; font-weight: bold; text-transform: uppercase; fill: #5a6a8a; }
  </style>
  <defs>
      <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a3a6b"/>
      </marker>
      <marker id="r" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
      </marker>
    </defs>

  <!-- NEW P7: EXECUTION ENVIRONMENT (Sandbox/VM containment) -->
  <rect x="200.0" y="525" width="260" height="55" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="330.0" y="547.5" text-anchor="middle" class="label" font-weight="bold" fill="#ef4444">P7  EXECUTION ENVIRONMENT</text>
    <text x="330.0" y="562.5" text-anchor="middle" class="sm" fill="#ef4444">[NEW]  ISM (Guidelines for gateways) | Container Security</text>
    <text x="330.0" y="539" text-anchor="middle" class="cap" fill="#ef4444">EE-01 -> EE-08</text>

  <!-- Arrow: P7 feeds P1 (execution environment hosts models) -->
  <line x1="330" y1="525" x2="330" y2="507" stroke="#ef4444" stroke-width="1.5" marker-end="url(#r)"/>

  <!-- P6 GRM (existing, shifted up) -->
  <line x1="330" y1="445" x2="330" y2="455" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="200.0" y="445" width="260" height="55" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="330.0" y="467.5" text-anchor="middle" class="label" font-weight="bold">P6  GOVERNANCE &amp; RISK (GRM)</text>
    <text x="330.0" y="482.5" text-anchor="middle" class="sm">APRA CPS 234 | PSPF | Privacy Act | NIST AI RMF</text>
    <text x="330.0" y="459" text-anchor="middle" class="cap">GRM-01 -> GRM-06</text>

  <line x1="330" y1="445" x2="330" y2="435" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- P5 MIR (existing, shifted up) -->
  <rect x="200.0" y="375" width="260" height="55" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="330.0" y="397.5" text-anchor="middle" class="label" font-weight="bold">P5  MONITORING &amp; INCIDENT RESPONSE</text>
    <text x="330.0" y="412.5" text-anchor="middle" class="sm">SOCI Act | APRA CPS 234 | Privacy NDB</text>
    <text x="330.0" y="389" text-anchor="middle" class="cap">MIR-01 -> MIR-06</text>

  <line x1="330" y1="375" x2="330" y2="365" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- P4 TP (existing) -->
  <rect x="200.0" y="305" width="260" height="55" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="330.0" y="327.5" text-anchor="middle" class="label" font-weight="bold">P4  TOOL &amp; PIPELINE SECURITY</text>
    <text x="330.0" y="342.5" text-anchor="middle" class="sm">ISM | E8 | SOCI Act</text>
    <text x="330.0" y="319" text-anchor="middle" class="cap">TP-01 -> TP-16</text>

  <line x1="310" y1="305" x2="230" y2="350" stroke="#1a3a6b" stroke-width="1.5"/>
  <line x1="350" y1="305" x2="430" y2="350" stroke="#1a3a6b" stroke-width="1.5"/>

  <!-- P3 DS (existing) -->
  <rect x="200.0" y="235" width="260" height="55" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="330.0" y="257.5" text-anchor="middle" class="label" font-weight="bold">P3b DATA SECURITY</text>
    <text x="330.0" y="272.5" text-anchor="middle" class="sm">Privacy Act | PSPF</text>
    <text x="330.0" y="249" text-anchor="middle" class="cap">DS-01 -> DS-08</text>

  <line x1="330" y1="235" x2="330" y2="225" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- P2 IAM (existing) -->
  <rect x="200.0" y="165" width="260" height="55" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="330.0" y="187.5" text-anchor="middle" class="label" font-weight="bold">P2b IDENTITY &amp; ACCESS</text>
    <text x="330.0" y="202.5" text-anchor="middle" class="sm">ISM | E8 | PSPF</text>
    <text x="330.0" y="179" text-anchor="middle" class="cap">IAM-01 -> IAM-10</text>

  <line x1="330" y1="165" x2="330" y2="155" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- P1 MS (existing) -->
  <rect x="200.0" y="95" width="260" height="55" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="330.0" y="117.5" text-anchor="middle" class="label" font-weight="bold">P1  MODEL SECURITY</text>
    <text x="330.0" y="132.5" text-anchor="middle" class="sm">ISM | OWASP | NIST</text>
    <text x="330.0" y="109" text-anchor="middle" class="cap">MS-01 -> MS-15</text>

  <!-- Arrow from bottom to top -->
  <line x1="330" y1="590" x2="330" y2="572" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="330" y="582" text-anchor="middle" class="sm" font-style="italic">Foundation (P7/P1) >> Governance (P6) -- each pillar depends on those below it</text>

  <!-- Annotations for parallel pillars -->
  <text x="200" y="372" text-anchor="middle" class="sm" fill="#0a1e3d" font-weight="bold">Data</text>
  <text x="460" y="372" text-anchor="middle" class="sm" fill="#0a1e3d" font-weight="bold">IAM</text>
  <text x="330" y="387" text-anchor="middle" class="sm">(parallel pillars)</text>

  <!-- NEW annotation: expanded controls -->
  <text x="492" y="120" text-anchor="start" class="sm" fill="#ef4444" font-size="9">+2 new controls</text>
  <text x="492" y="190" text-anchor="start" class="sm" fill="#ef4444" font-size="9">+2 new controls</text>
  <text x="492" y="330" text-anchor="start" class="sm" fill="#ef4444" font-size="9">+2 new controls</text>
</svg>