<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 450" width="100%" height="100%">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .title { font-size: 16px; font-weight: bold; fill: #0a1e3d; }
    .label { font-size: 12px; fill: #1a1a2e; }
    .sm { font-size: 10px; fill: #5a6a8a; }
    .gold { fill: #d4a017; }
    .white { fill: #ffffff; }
    .cap { font-size: 9px; font-weight: bold; text-transform: uppercase; fill: #5a6a8a; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a3a6b"/>
    </marker>
  </defs>
  <rect x="40" y="170" width="170" height="80" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="125.0" y="204.0" text-anchor="middle" class="label" font-size="12" font-weight="bold">Agent Action</text>
    <text x="125.0" y="222.0" text-anchor="middle" class="sm">tool call, data access, model</text>
  <rect x="255" y="40" width="160" height="80" rx="6" fill="#dce6f0" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="335.0" y="84.0" text-anchor="middle" class="label" font-size="12" font-weight="bold">P1 Tool Authorisation</text>
    <text x="335.0" y="102.0" text-anchor="middle" class="sm">IAM-01/02/08, TP-02</text>
    <text x="335.0" y="57" text-anchor="middle" class="cap">ALLOW/DENY</text>
  <rect x="425" y="40" width="160" height="80" rx="6" fill="#dce6f0" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="505.0" y="84.0" text-anchor="middle" class="label" font-size="12" font-weight="bold">P2 Data Access</text>
    <text x="505.0" y="102.0" text-anchor="middle" class="sm">DS-01/04, ABAC at retrieval</text>
    <text x="505.0" y="57" text-anchor="middle" class="cap">SCOPE</text>
  <rect x="595" y="40" width="160" height="80" rx="6" fill="#dce6f0" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="675.0" y="84.0" text-anchor="middle" class="label" font-size="12" font-weight="bold">P3 Human Approval</text>
    <text x="675.0" y="102.0" text-anchor="middle" class="sm">IAM-03, high-risk actions</text>
    <text x="675.0" y="57" text-anchor="middle" class="cap">GATE</text>
  <rect x="765" y="40" width="160" height="80" rx="6" fill="#dce6f0" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="845.0" y="84.0" text-anchor="middle" class="label" font-size="12" font-weight="bold">P4 Output Validation</text>
    <text x="845.0" y="102.0" text-anchor="middle" class="sm">TP-04, DS-06, MS-05</text>
    <text x="845.0" y="57" text-anchor="middle" class="cap">SANITISE</text>
  <rect x="765" y="170" width="160" height="80" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="845.0" y="204.0" text-anchor="middle" class="label" font-size="12" font-weight="bold">Tool / Data / Model</text>
    <text x="845.0" y="222.0" text-anchor="middle" class="sm">execution proceeds</text>
  <line x1="415" y1="80" x2="425" y2="80" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="585" y1="80" x2="595" y2="80" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="755" y1="80" x2="765" y2="80" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="845" y1="120" x2="845" y2="170" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="210" y1="210" x2="255" y2="120" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="232" y="168" text-anchor="middle" class="sm">enforce</text>
  <line x1="335" y1="120" x2="335" y2="335" stroke="#c0392b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="150" y="320" text-anchor="middle" class="sm" fill="#c0392b">DENY -&gt; log via MIR-01, alert MIR-02</text>
  <rect x="145" y="335" width="380" height="55" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="335.0" y="356.5" text-anchor="middle" class="label" font-size="12" font-weight="bold">Policy Engine (OPA)</text>
    <text x="335.0" y="374.5" text-anchor="middle" class="sm">Rego assertions from policies/ -- audit every decision</text>
  <text x="335" y="415" text-anchor="middle" class="sm">policy verdict + evidence -&gt; telemetry (MIR-01)</text>
  <text x="475" y="440" text-anchor="middle" class="sm">Every decision point is a Rego evaluation; every verdict is an audit event.</text>
</svg>