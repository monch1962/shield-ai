    </defs>
    <!-- NEW Top Layer: SANDBOX/VM ESCAPE -->
    <rect x="90.0" y="472" width="400" height="40" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="290.0" y="490.0" text-anchor="middle" class="label" font-weight="bold" fill="#ef4444">SANDBOX / VM CONTAINMENT</text>
    <text x="290.0" y="502.0" text-anchor="middle" class="sm" fill="#ef4444">[NEW]  Container escape | VM boundary | Hypervisor isolation</text>
    <line x1="290.0" y1="472" x2="290.0" y2="460" stroke="#ef4444" stroke-width="2" marker-end="url(#r)"/>

    <!-- Layer 6: GOVERNANCE (existing) -->
    <rect x="90.0" y="410" width="400" height="42" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="290.0" y="428.0" text-anchor="middle" class="label" font-weight="bold">GOVERNANCE</text>
    <text x="290.0" y="442.0" text-anchor="middle" class="sm">[GOV]  Shadow AI | Missing audit trails | Incident reconstruction</text>
    <line x1="290.0" y1="410" x2="290.0" y2="398" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>

    <!-- Layer 5: PIPELINE (existing) -->
    <rect x="90.0" y="348" width="400" height="42" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="290.0" y="366.0" text-anchor="middle" class="label" font-weight="bold">PIPELINE</text>
    <text x="290.0" y="380.0" text-anchor="middle" class="sm">[PPL]  CI/CD compromise | Model substitution | Chain poisoning</text>
    <line x1="290.0" y1="348" x2="290.0" y2="336" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>

    <!-- Layer 4: IDENTITY (existing) -->
    <rect x="90.0" y="286" width="400" height="42" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="290.0" y="304.0" text-anchor="middle" class="label" font-weight="bold">IDENTITY</text>
    <text x="290.0" y="318.0" text-anchor="middle" class="sm">[ID]   Credential abuse | Session hijack | Escalation</text>
    <line x1="290.0" y1="286" x2="290.0" y2="274" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>

