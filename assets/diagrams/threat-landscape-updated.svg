    <text x="290.0" y="256.0" text-anchor="middle" class="sm">[DAT]  Cross-session aggregation | RAG poisoning | PII leak</text>
    <line x1="290.0" y1="224" x2="290.0" y2="212" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>

