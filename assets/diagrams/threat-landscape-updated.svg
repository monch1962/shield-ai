    <rect x="90.0" y="162" width="400" height="42" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="290.0" y="180.0" text-anchor="middle" class="label" font-weight="bold">TOOLS</text>
    <text x="290.0" y="194.0" text-anchor="middle" class="sm">[TUL]  Tool output injection | Malicious registration | API abuse</text>
