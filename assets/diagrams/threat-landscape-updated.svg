    <!-- Layer 1: MODEL (existing) -->
    <rect x="90.0" y="100" width="400" height="42" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="290.0" y="118.0" text-anchor="middle" class="label" font-weight="bold">MODEL</text>
    <text x="290.0" y="132.0" text-anchor="middle" class="sm">[MDL]  Prompt injection | Jailbreaking | Model inversion</text>

    <!-- New annotation: sandbox escape as cross-cutting -->
    <text x="290.0" y="537" text-anchor="middle" class="sm" font-style="italic" fill="#ef4444">[NEW] Sandbox/VM Escape as a cross-cutting layer above Governance — every pillar below can be breached via sandbox escape</text>
    <text x="290.0" y="552" text-anchor="middle" class="sm" font-style="italic">Risk compounds upward: a Model compromise enables Tool abuse, which enables Data exfiltration</text>
</svg>