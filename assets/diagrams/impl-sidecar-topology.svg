<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" width="100%" height="100%">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .title { font-size: 16px; font-weight: bold; fill: #0a1e3d; }
    .label { font-size: 12px; fill: #1a1a2e; }
    .sm { font-size: 10px; fill: #5a6a8a; }
    .gold { fill: #d4a017; }
    .white { fill: #ffffff; }
    .cap { font-size: 9px; font-weight: bold; text-transform: uppercase; fill: #5a6a8a; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a3a6b"/>
    </marker>
  </defs>
  <rect x="20" y="30" width="640" height="420" rx="10" fill="#f0f4f8" stroke="#1a3a6b" stroke-width="1.2"/>
    <text x="30" y="46" class="cap">KUBERNETES CLUSTER - AGENT NAMESPACE</text>
  <rect x="690" y="30" width="370" height="420" rx="10" fill="#f7fafd" stroke="#1a3a6b" stroke-width="1.2"/>
    <text x="700" y="46" class="cap">CENTRAL SERVICES</text>
  <rect x="60" y="70" width="280" height="55" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="200.0" y="91.5" text-anchor="middle" class="label" font-size="12" font-weight="bold">Agent Pod A</text>
    <text x="200.0" y="109.5" text-anchor="middle" class="sm">agent container (sandbox)</text>
  <rect x="60" y="140" width="280" height="55" rx="6" fill="#dce6f0" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="200.0" y="161.5" text-anchor="middle" class="label" font-size="12" font-weight="bold">Sidecar: OPA Policy</text>
    <text x="200.0" y="179.5" text-anchor="middle" class="sm">Rego eval per action</text>
  <rect x="60" y="210" width="280" height="55" rx="6" fill="#dce6f0" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="200.0" y="231.5" text-anchor="middle" class="label" font-size="12" font-weight="bold">Sidecar: Tool Gateway</text>
    <text x="200.0" y="249.5" text-anchor="middle" class="sm">allow-list, schema, audit</text>
  <rect x="60" y="280" width="280" height="55" rx="6" fill="#dce6f0" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="200.0" y="301.5" text-anchor="middle" class="label" font-size="12" font-weight="bold">Sidecar: Telemetry</text>
    <text x="200.0" y="319.5" text-anchor="middle" class="sm">OTLP exporter, audit buffer</text>
  <line x1="200" y1="125" x2="200" y2="140" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="200" y1="195" x2="200" y2="210" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="200" y1="265" x2="200" y2="280" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="360" y="70" width="280" height="55" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="500.0" y="91.5" text-anchor="middle" class="label" font-size="12" font-weight="bold">Agent Pod B</text>
    <text x="500.0" y="109.5" text-anchor="middle" class="sm">agent container (sandbox)</text>
  <rect x="360" y="140" width="280" height="55" rx="6" fill="#dce6f0" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="500.0" y="161.5" text-anchor="middle" class="label" font-size="12" font-weight="bold">Sidecar: OPA Policy</text>
    <text x="500.0" y="179.5" text-anchor="middle" class="sm">Rego eval per action</text>
  <rect x="360" y="210" width="280" height="55" rx="6" fill="#dce6f0" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="500.0" y="231.5" text-anchor="middle" class="label" font-size="12" font-weight="bold">Sidecar: Tool Gateway</text>
    <text x="500.0" y="249.5" text-anchor="middle" class="sm">allow-list, schema, audit</text>
  <rect x="360" y="280" width="280" height="55" rx="6" fill="#dce6f0" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="500.0" y="301.5" text-anchor="middle" class="label" font-size="12" font-weight="bold">Sidecar: Telemetry</text>
    <text x="500.0" y="319.5" text-anchor="middle" class="sm">OTLP exporter, audit buffer</text>
  <line x1="500" y1="125" x2="500" y2="140" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="500" y1="195" x2="500" y2="210" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="500" y1="265" x2="500" y2="280" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="340" y="370" text-anchor="middle" class="sm">sidecars fail closed: no policy / no audit = no action (EE-06)</text>
  <rect x="720" y="70" width="310" height="55" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="875.0" y="91.5" text-anchor="middle" class="label" font-size="12" font-weight="bold">Central Model Gateway</text>
    <text x="875.0" y="109.5" text-anchor="middle" class="sm">guardrails, redaction</text>
  <rect x="720" y="140" width="310" height="55" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="875.0" y="161.5" text-anchor="middle" class="label" font-size="12" font-weight="bold">Tool Registry + MCP Gateway</text>
    <text x="875.0" y="179.5" text-anchor="middle" class="sm">signed tool definitions</text>
  <rect x="720" y="210" width="310" height="55" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="875.0" y="231.5" text-anchor="middle" class="label" font-size="12" font-weight="bold">Identity Plane</text>
    <text x="875.0" y="249.5" text-anchor="middle" class="sm">SPIFFE/SPIRE, JIT creds</text>
  <rect x="720" y="280" width="310" height="55" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="875.0" y="301.5" text-anchor="middle" class="label" font-size="12" font-weight="bold">SIEM / Compliance</text>
    <text x="875.0" y="319.5" text-anchor="middle" class="sm">dashboards, reporting</text>
  <line x1="340" y1="105" x2="720" y2="105" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <text x="530" y="97" text-anchor="middle" class="sm">policy + tool decisions</text>
  <line x1="340" y1="175" x2="720" y2="175" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <text x="530" y="167" text-anchor="middle" class="sm">audit events</text>
  <line x1="340" y1="245" x2="720" y2="245" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <text x="530" y="237" text-anchor="middle" class="sm">identity checks</text>
  <text x="540" y="440" text-anchor="middle" class="sm">Scale: 10-100 agents. Beyond 100: central gateway for external tools, sidecars retained for per-agent policy and audit.</text>
</svg>