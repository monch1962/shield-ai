<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="100%" height="100%">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .title { font-size: 16px; font-weight: bold; fill: #0a1e3d; }
    .label { font-size: 12px; fill: #1a1a2e; }
    .sm { font-size: 10px; fill: #5a6a8a; }
    .gold { fill: #d4a017; }
    .white { fill: #ffffff; }
    .cap { font-size: 9px; font-weight: bold; text-transform: uppercase; fill: #5a6a8a; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a3a6b"/>
    </marker>
  </defs>
  <rect x="30" y="30" width="250" height="40" rx="6" fill="#0a1e3d" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="155.0" y="50.0" text-anchor="middle" class="white" font-size="13" font-weight="bold" fill="#ffffff">L1  INITIAL</text>
  <rect x="290" y="30" width="250" height="40" rx="6" fill="#0a1e3d" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="415.0" y="50.0" text-anchor="middle" class="white" font-size="13" font-weight="bold" fill="#ffffff">L2  MANAGED</text>
  <rect x="550" y="30" width="250" height="40" rx="6" fill="#0a1e3d" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="675.0" y="50.0" text-anchor="middle" class="white" font-size="13" font-weight="bold" fill="#ffffff">L3  DEFINED</text>
  <rect x="810" y="30" width="250" height="40" rx="6" fill="#0a1e3d" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="935.0" y="50.0" text-anchor="middle" class="white" font-size="13" font-weight="bold" fill="#ffffff">L4  OPTIMISED</text>
  <rect x="30" y="80" width="250" height="380" rx="10" fill="#fbfcfd" stroke="#1a3a6b" stroke-width="1.2"/>
    <text x="40" y="96" class="cap"></text>
  <text x="155" y="110" text-anchor="middle" class="label" font-size="11">Model inventory (MS-06)</text>
  <text x="155" y="136" text-anchor="middle" class="label" font-size="11">Container per agent (EE-01 basic)</text>
  <text x="155" y="162" text-anchor="middle" class="label" font-size="11">Basic logging (MIR-01)</text>
  <text x="155" y="188" text-anchor="middle" class="label" font-size="11">Per-agent accounts (IAM-01)</text>
  <text x="155" y="214" text-anchor="middle" class="label" font-size="11">Prompt injection testing (MS-04)</text>
  <rect x="290" y="80" width="250" height="380" rx="10" fill="#fbfcfd" stroke="#1a3a6b" stroke-width="1.2"/>
    <text x="300" y="96" class="cap"></text>
  <text x="415" y="110" text-anchor="middle" class="label" font-size="11">+ Model registry + signing (MS-03)</text>
  <text x="415" y="136" text-anchor="middle" class="label" font-size="11">+ Read-only rootfs, NetworkPolicy (EE-01)</text>
  <text x="415" y="162" text-anchor="middle" class="label" font-size="11">+ Resource limits (EE-03)</text>
  <text x="415" y="188" text-anchor="middle" class="label" font-size="11">+ Tool registry (TP-01)</text>
  <text x="415" y="214" text-anchor="middle" class="label" font-size="11">+ Structured audit logs (MIR-01)</text>
  <text x="415" y="240" text-anchor="middle" class="label" font-size="11">+ RAG security layer (DS-01/04)</text>
  <rect x="550" y="80" width="250" height="380" rx="10" fill="#fbfcfd" stroke="#1a3a6b" stroke-width="1.2"/>
    <text x="560" y="96" class="cap"></text>
  <text x="675" y="110" text-anchor="middle" class="label" font-size="11">+ OPA policy engine (IAM-02/07/08)</text>
  <text x="675" y="136" text-anchor="middle" class="label" font-size="11">+ Tool gateway / MCP gateway (TP-03/08)</text>
  <text x="675" y="162" text-anchor="middle" class="label" font-size="11">+ seccomp/AppArmor (EE-01)</text>
  <text x="675" y="188" text-anchor="middle" class="label" font-size="11">+ Host-file injection prevention (EE-05)</text>
  <text x="675" y="214" text-anchor="middle" class="label" font-size="11">+ Fail-closed sandbox (EE-06)</text>
  <text x="675" y="240" text-anchor="middle" class="label" font-size="11">+ SIEM + anomaly detection (MIR-02)</text>
  <text x="675" y="266" text-anchor="middle" class="label" font-size="11">+ Reporting triggers (MIR-05)</text>
  <rect x="810" y="80" width="250" height="380" rx="10" fill="#fbfcfd" stroke="#1a3a6b" stroke-width="1.2"/>
    <text x="820" y="96" class="cap"></text>
  <text x="935" y="110" text-anchor="middle" class="label" font-size="11">+ Remote attestation (EE-01)</text>
  <text x="935" y="136" text-anchor="middle" class="label" font-size="11">+ Continuous red-teaming (MS-04)</text>
  <text x="935" y="162" text-anchor="middle" class="label" font-size="11">+ AI-specific threat intel</text>
  <text x="935" y="188" text-anchor="middle" class="label" font-size="11">+ Multi-entity governance (GRM-01)</text>
  <text x="935" y="214" text-anchor="middle" class="label" font-size="11">+ Continuous compliance (GRM-05/06)</text>
  <line x1="280" y1="100" x2="290" y2="100" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="540" y1="100" x2="550" y2="100" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="800" y1="100" x2="810" y2="100" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="540" y="500" text-anchor="middle" class="sm">Each level adds deployable components -- sequencing follows the Assessment Guide's maturity progression (weakest pillar first).</text>
  <text x="540" y="535" text-anchor="middle" class="sm">Indicative progression: L1-&gt;L2 3-4 months | L1-&gt;L3 8-12 months | L3-&gt;L4 12+ months</text>
</svg>