<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="100%" height="100%">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .title { font-size: 16px; font-weight: bold; fill: #0a1e3d; }
    .label { font-size: 12px; fill: #1a1a2e; }
    .sm { font-size: 10px; fill: #5a6a8a; }
    .gold { fill: #d4a017; }
    .white { fill: #ffffff; }
    .cap { font-size: 9px; font-weight: bold; text-transform: uppercase; fill: #5a6a8a; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a3a6b"/>
    </marker>
  </defs>
  <rect x="20" y="30" width="330" height="480" rx="10" fill="#fdf6ec" stroke="#1a3a6b" stroke-width="1.2"/>
    <text x="30" y="46" class="cap">PUBLIC / CLIENT ZONE</text>
  <rect x="370" y="30" width="300" height="480" rx="10" fill="#f0f4f8" stroke="#1a3a6b" stroke-width="1.2"/>
    <text x="380" y="46" class="cap">AGENT ZONE (SANDBOXES)</text>
  <rect x="690" y="30" width="370" height="480" rx="10" fill="#eef7ee" stroke="#1a3a6b" stroke-width="1.2"/>
    <text x="700" y="46" class="cap">TRUSTED SERVICE ZONE</text>
  <rect x="60" y="70" width="250" height="60" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="185.0" y="94.0" text-anchor="middle" class="label" font-size="12" font-weight="bold">Users / Browsers / Apps</text>
    <text x="185.0" y="112.0" text-anchor="middle" class="sm">TLS 1.3 ingress</text>
  <rect x="60" y="160" width="250" height="60" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="185.0" y="184.0" text-anchor="middle" class="label" font-size="12" font-weight="bold">Agent Orchestrator APIs</text>
    <text x="185.0" y="202.0" text-anchor="middle" class="sm">authenticated</text>
  <rect x="410" y="70" width="230" height="90" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="525.0" y="119.0" text-anchor="middle" class="label" font-size="12" font-weight="bold">Agent Sandbox Pods</text>
    <text x="525.0" y="137.0" text-anchor="middle" class="sm">NetworkPolicy: egress allow-list only</text>
    <text x="525.0" y="87" text-anchor="middle" class="cap">EE-01</text>
  <rect x="410" y="200" width="230" height="90" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="525.0" y="249.0" text-anchor="middle" class="label" font-size="12" font-weight="bold">Policy Engine (OPA)</text>
    <text x="525.0" y="267.0" text-anchor="middle" class="sm">deny by default</text>
    <text x="525.0" y="217" text-anchor="middle" class="cap">ALLOW-LIST</text>
  <rect x="410" y="330" width="230" height="90" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="525.0" y="379.0" text-anchor="middle" class="label" font-size="12" font-weight="bold">Tool Gateway / MCP</text>
    <text x="525.0" y="397.0" text-anchor="middle" class="sm">allow-listed endpoints only</text>
    <text x="525.0" y="347" text-anchor="middle" class="cap">TP-03/08</text>
  <rect x="725" y="70" width="300" height="70" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="875.0" y="109.0" text-anchor="middle" class="label" font-size="12" font-weight="bold">Registered Tools &amp; APIs</text>
    <text x="875.0" y="127.0" text-anchor="middle" class="sm">explicitly registered</text>
    <text x="875.0" y="87" text-anchor="middle" class="cap">TP-01</text>
  <rect x="725" y="170" width="300" height="70" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="875.0" y="199.0" text-anchor="middle" class="label" font-size="12" font-weight="bold">Model Providers (egress)</text>
    <text x="875.0" y="217.0" text-anchor="middle" class="sm">signed certs, IP allow-list</text>
  <rect x="725" y="270" width="300" height="70" rx="6" fill="#ffffff" stroke="#1a3a6b" stroke-width="1.5"/>
    <text x="875.0" y="309.0" text-anchor="middle" class="label" font-size="12" font-weight="bold">Data Stores (RAG, memory)</text>
    <text x="875.0" y="327.0" text-anchor="middle" class="sm">ABAC + encryption</text>
    <text x="875.0" y="287" text-anchor="middle" class="cap">DS-01..07</text>
  <rect x="725" y="380" width="300" height="80" rx="6" fill="#fdf0f0" stroke="#c0392b" stroke-width="1.5"/>
    <text x="875.0" y="424.0" text-anchor="middle" class="label" font-size="12" font-weight="bold">CLOUD CONTROL PLANES - BLOCKED</text>
    <text x="875.0" y="442.0" text-anchor="middle" class="sm">EC2, IAM, Lambda, KMS, Azure RM, GCP CRM</text>
    <text x="875.0" y="397" text-anchor="middle" class="cap">EE-02 / TP-08</text>
  <line x1="310" y1="100" x2="410" y2="115" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="310" y1="190" x2="410" y2="245" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="525" y1="160" x2="525" y2="200" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="525" y1="290" x2="525" y2="330" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="640" y1="115" x2="725" y2="105" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="640" y1="205" x2="725" y2="205" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="640" y1="375" x2="725" y2="305" stroke="#1a3a6b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="640" y1="420" x2="725" y2="420" stroke="#c0392b" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <text x="520" y="455" text-anchor="middle" class="sm" fill="#c0392b">agent -&gt; control-plane attempts blocked + alerted (IoC)</text>
  <text x="215" y="260" text-anchor="middle" class="sm">no direct path to</text>
  <text x="215" y="275" text-anchor="middle" class="sm">infrastructure APIs</text>
  <text x="870" y="475" text-anchor="middle" class="sm">Infrastructure APIs are only reachable as explicitly</text>
  <text x="870" y="490" text-anchor="middle" class="sm">registered tools via TP-01 with risk acceptance (GRM-02).</text>
</svg>