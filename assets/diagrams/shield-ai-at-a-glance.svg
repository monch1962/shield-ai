" height="3" rx="1.5" fill="#d97706"/><text x="505" y="357" text-anchor="middle" fill="#d97706" font-size="10" font-weight="bold">DS</text><text x="505" y="371" text-anchor="middle" class="sm" fill="#d97706">Data Security</text><text x="505" y="383" text-anchor="middle" class="sm" fill="#5a6a8a">the data</text><rect x="317" y="339" width="116" height="52" rx="6" fill="#7c3aed" opacity="0.10"/><rect x="317" y="339" width="116" height="3" rx="1.5" fill="#7c3aed"/><text x="375" y="357" text-anchor="middle" fill="#7c3aed" font-size="10" font-weight="bold">TP</text><text x="375" y="371" text-anchor="middle" class="sm" fill="#7c3aed">Tool &amp; Pipeline Security</text><text x="375" y="383" text-anchor="middle" class="sm" fill="#5a6a8a">the tools</text><rect x="236" y="237" width="116" height="52" rx="6" fill="#db2777" opacity="0.10"/><rect x="236" y="237" width="116" height="3" rx="1.5" fill="#db2777"/><text x="294" y="255" text-anchor="middle" fill="#db2777" font-size="10" font-weight="bold">MIR</text><text x="294" y="269" text-anchor="middle" class="sm" fill="#db2777">Monitoring, Logging &amp; IR</text><text x="294" y="281" text-anchor="middle" class="sm" fill="#5a6a8a">the monitoring</text><rect x="265" y="110" width="116" height="52" rx="6" fill="#475569" opacity="0.10"/><rect x="265" y="110" width="116" height="3" rx="1.5" fill="#475569"/><text x="323" y="128" text-anchor="middle" fill="#475569" font-size="10" font-weight="bold">GRM</text><text x="323" y="142" text-anchor="middle" class="sm" fill="#475569">Governance &amp; Risk</text><text x="323" y="154" text-anchor="middle" class="sm" fill="#5a6a8a">the governance</text><text x="440.0" y="426" text-anchor="middle" class="sm" font-style="italic">seven pillars, 69 controls - each verified by an executable policy</text>
