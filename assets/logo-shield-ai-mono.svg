<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Shield hexagon -->
  <polygon points="200,100 285,155 285,265 200,325 115,265 115,155"
           fill="none" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="200,112 272,161 272,259 200,313 128,259 128,161"
           fill="none" stroke="#000" stroke-width="1" stroke-linejoin="round" stroke-dasharray="3,3"/>

  <!-- Cross connections -->
  <line x1="115" y1="155" x2="285" y2="155" stroke="#000" stroke-width="1" opacity="0.4"/>
  <line x1="115" y1="265" x2="285" y2="265" stroke="#000" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="100" x2="200" y2="325" stroke="#000" stroke-width="1" opacity="0.25"/>
  <line x1="115" y1="155" x2="285" y2="265" stroke="#000" stroke-width="1" opacity="0.35"/>
  <line x1="285" y1="155" x2="115" y2="265" stroke="#000" stroke-width="1" opacity="0.35"/>

  <!-- Inner S -->
  <path d="M 125,170 C 155,140 200,120 240,150 C 270,170 270,210 240,230 C 200,250 175,270 160,290 C 145,310 155,310 170,305"
        fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" filter="url(#g)"/>

  <!-- 6 nodes -->
  <circle cx="200" cy="100" r="7" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <circle cx="285" cy="155" r="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="285" cy="265" r="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="200" cy="325" r="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="115" cy="265" r="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="115" cy="155" r="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="200" cy="100" r="2" fill="#000"/>
  <circle cx="285" cy="155" r="1.5" fill="#000"/>
  <circle cx="285" cy="265" r="1.5" fill="#000"/>
  <circle cx="200" cy="325" r="1.5" fill="#000"/>
  <circle cx="115" cy="265" r="1.5" fill="#000"/>
  <circle cx="115" cy="155" r="1.5" fill="#000"/>

  <!-- SHIELD text -->
  <text x="200" y="400"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="48" font-weight="700" letter-spacing="6"
        fill="#000" text-anchor="middle" dominant-baseline="middle">
    SHIELD
  </text>

  <!-- -AI -->
  <text x="284" y="400"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="48" font-weight="700" letter-spacing="3"
        fill="#555" text-anchor="start" dominant-baseline="middle">
    -AI
  </text>

  <!-- TM -->
  <text x="340" y="382"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="14" font-weight="400" fill="#555" text-anchor="start" dominant-baseline="middle">
    ™
  </text>

  <!-- Tagline -->
  <text x="200" y="435"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="10" font-weight="500" letter-spacing="4"
        fill="#888" text-anchor="middle" dominant-baseline="middle">
    SOVEREIGN AUSTRALIAN AI SECURITY FRAMEWORK
  </text>
</svg>
