<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle (for contexts that need a backing shape) -->
  <circle cx="100" cy="100" r="93" fill="none"/>

  <!-- Shield hexagon -->
  <polygon points="100,20 170,60 170,140 100,180 30,140 30,60"
           fill="none" stroke="#1A5A7A" stroke-width="3" stroke-linejoin="round" filter="url(#sg)"/>
  <polygon points="100,30 160,65 160,135 100,170 40,135 40,65"
           fill="none" stroke="#0F3A5A" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4,3"/>

  <!-- Network lines -->
  <line x1="30" y1="60" x2="170" y2="60" stroke="#D4A843" stroke-width="1.5" opacity="0.5"/>
  <line x1="30" y1="140" x2="170" y2="140" stroke="#D4A843" stroke-width="1.5" opacity="0.5"/>
  <line x1="100" y1="20" x2="100" y2="180" stroke="#D4A843" stroke-width="1.5" opacity="0.3"/>
  <line x1="30" y1="60" x2="170" y2="140" stroke="#1A7A7A" stroke-width="1.5" opacity="0.45"/>
  <line x1="170" y1="60" x2="30" y2="140" stroke="#1A7A7A" stroke-width="1.5" opacity="0.45"/>

  <!-- Inner S -->
  <path d="M 40,75
           C 65,48 100,38 130,65
           C 152,85 152,118 130,135
           C 105,152 80,165 65,180"
        fill="none" stroke="#D4A843" stroke-width="2.5" stroke-linecap="round" filter="url(#g)"/>

  <!-- 6 nodes -->
  <circle cx="100" cy="20" r="8" fill="#0A1F3F" stroke="#D4A843" stroke-width="2.5" filter="url(#g)"/>
  <circle cx="170" cy="60" r="7" fill="#0A1F3F" stroke="#1A7A7A" stroke-width="2"/>
  <circle cx="170" cy="140" r="7" fill="#0A1F3F" stroke="#1A7A7A" stroke-width="2"/>
  <circle cx="100" cy="180" r="7" fill="#0A1F3F" stroke="#1A7A7A" stroke-width="2"/>
  <circle cx="30" cy="140" r="7" fill="#0A1F3F" stroke="#1A7A7A" stroke-width="2"/>
  <circle cx="30" cy="60" r="7" fill="#0A1F3F" stroke="#1A7A7A" stroke-width="2"/>

  <!-- Node centres -->
  <circle cx="100" cy="20" r="2.5" fill="#D4A843" filter="url(#g)"/>
  <circle cx="170" cy="60" r="2" fill="#1A7A7A"/>
  <circle cx="170" cy="140" r="2" fill="#1A7A7A"/>
  <circle cx="100" cy="180" r="2" fill="#1A7A7A"/>
  <circle cx="30" cy="140" r="2" fill="#1A7A7A"/>
  <circle cx="30" cy="60" r="2" fill="#1A7A7A"/>
</svg>
