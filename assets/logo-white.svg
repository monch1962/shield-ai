<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <style>
      .txt { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 700; }
      .sub { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 400; }
    </style>
  </defs>

  <!-- Reversed icon on dark -->
  <g transform="translate(4, 0)">
    <!-- Shield outline (white) -->
    <path d="M 46,3 Q 3,-3 3,28 L 3,52 L 46,94 L 89,52 L 89,28 Q 89,-3 46,3 Z"
          fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Left half fill (white) -->
    <path d="M 46,3 Q 3,-3 3,28 L 3,52 L 46,94 Z"
          fill="#ffffff" stroke="none"/>

    <!-- Bracket lines (navy on white fill) -->
    <line x1="52" y1="30" x2="72" y2="38" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="52" y1="44" x2="78" y2="54" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="46" y1="58" x2="66" y2="58" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="52" y1="68" x2="62" y2="73" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Gold dot -->
    <circle cx="46" cy="16" r="3.5" fill="#d4a017"/>
  </g>

  <!-- Wordmark (white) -->
  <text x="110" y="42" class="txt" font-size="26" fill="#ffffff" letter-spacing="3">SHIELD</text>
  <text x="110" y="76" class="sub" font-size="18" fill="#b0b8c8" letter-spacing="6">AI SECURITY</text>
  <line x1="108" y1="50" x2="108" y2="68" stroke="#d4a017" stroke-width="3" stroke-linecap="round"/>
</svg>
