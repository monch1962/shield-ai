<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Shield / Hexagon (smaller, shifted left) -->
  <polygon points="100,30 155,65 155,125 100,160 45,125 45,65"
           fill="none" stroke="#1A5A7A" stroke-width="2.5" stroke-linejoin="round" filter="url(#sg)"/>
  <polygon points="100,38 148,68 148,122 100,152 52,122 52,68"
           fill="none" stroke="#0F3A5A" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="3,3"/>

  <!-- Cross connections -->
  <line x1="45" y1="65" x2="155" y2="65" stroke="#D4A843" stroke-width="1.2" opacity="0.5"/>
  <line x1="45" y1="125" x2="155" y2="125" stroke="#D4A843" stroke-width="1.2" opacity="0.5"/>
  <line x1="100" y1="30" x2="100" y2="160" stroke="#D4A843" stroke-width="1.2" opacity="0.3"/>
  <line x1="45" y1="65" x2="155" y2="125" stroke="#1A7A7A" stroke-width="1.2" opacity="0.4"/>
  <line x1="155" y1="65" x2="45" y2="125" stroke="#1A7A7A" stroke-width="1.2" opacity="0.4"/>

  <!-- Inner S path -->
  <path d="M 52,76 C 72,56 100,50 122,68 C 140,82 140,108 122,122 C 100,136 84,150 75,160 C 68,168 72,170 82,166"
        fill="none" stroke="#D4A843" stroke-width="2" stroke-linecap="round" filter="url(#g)"/>

  <!-- 6 nodes -->
  <circle cx="100" cy="30" r="6.5" fill="#0A1F3F" stroke="#D4A843" stroke-width="2" filter="url(#g)"/>
  <circle cx="155" cy="65" r="5.5" fill="#0A1F3F" stroke="#1A7A7A" stroke-width="1.5"/>
  <circle cx="155" cy="125" r="5.5" fill="#0A1F3F" stroke="#1A7A7A" stroke-width="1.5"/>
  <circle cx="100" cy="160" r="5.5" fill="#0A1F3F" stroke="#1A7A7A" stroke-width="1.5"/>
  <circle cx="45" cy="125" r="5.5" fill="#0A1F3F" stroke="#1A7A7A" stroke-width="1.5"/>
  <circle cx="45" cy="65" r="5.5" fill="#0A1F3F" stroke="#1A7A7A" stroke-width="1.5"/>
  <circle cx="100" cy="30" r="2" fill="#D4A843" filter="url(#g)"/>
  <circle cx="155" cy="65" r="1.5" fill="#1A7A7A"/>
  <circle cx="155" cy="125" r="1.5" fill="#1A7A7A"/>
  <circle cx="100" cy="160" r="1.5" fill="#1A7A7A"/>
  <circle cx="45" cy="125" r="1.5" fill="#1A7A7A"/>
  <circle cx="45" cy="65" r="1.5" fill="#1A7A7A"/>

  <!-- SHIELD text (beside icon, bigger) -->
  <text x="185" y="92"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="42" font-weight="700" letter-spacing="5"
        fill="#0A1F3F" text-anchor="start" dominant-baseline="middle">
    SHIELD
  </text>

  <!-- -AI -->
  <text x="280" y="92"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="42" font-weight="700" letter-spacing="2"
        fill="#1A7A7A" text-anchor="start" dominant-baseline="middle">
    -AI
  </text>

  <!-- TM -->
  <text x="335" y="75"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="12" font-weight="400" fill="#D4A843" text-anchor="start" dominant-baseline="middle">
    ™
  </text>
</svg>
