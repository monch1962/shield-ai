<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .title { font-size: 18px; font-weight: bold; fill: #0a1e3d; }
    .hdr { font-size: 11px; font-weight: bold; fill: #0a1e3d; }
    .pillar { font-size: 11.5px; font-weight: bold; fill: #1a1a2e; }
    .cap { font-size: 9.5px; font-weight: bold; text-transform: uppercase; fill: #5a6a8a; }
    .note { font-size: 10px; fill: #5a6a8a; }
    .gold { fill: #d4a017; }
    .navy { fill: #1a3a6b; }
    .red { fill: #ef4444; }
    .white { fill: #ffffff; }
  </style>

  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>
  <rect x="0" y="0" width="960" height="6" fill="#0a1e3d"/>

  <text x="30" y="40" class="title">SHIELD-AI alignment with a major Australian retailer's obligations</text>
  <text x="30" y="58" class="note">Seven pillars mapped to the regulatory set a national retailer operates under. Solid = direct control mapping. Gold = supporting contribution.</text>

  <!-- column headers -->
  <text x="230" y="95" class="hdr" text-anchor="middle">Privacy Act</text>
  <text x="360" y="95" class="hdr" text-anchor="middle">PCI DSS</text>
  <text x="490" y="95" class="hdr" text-anchor="middle">Cyber Security Act 2024</text>
  <text x="620" y="95" class="hdr" text-anchor="middle">SOCI Act</text>
  <text x="750" y="95" class="hdr" text-anchor="middle">ISM / E8</text>
  <text x="880" y="95" class="hdr" text-anchor="middle">AU Guardrails</text>
  <text x="230" y="107" class="cap" text-anchor="middle">APP 11 + NDB</text>
  <text x="360" y="107" class="cap" text-anchor="middle">Cardholder data</text>
  <text x="490" y="107" class="cap" text-anchor="middle">Positive obligations</text>
  <text x="620" y="107" class="cap" text-anchor="middle">*Food &amp; grocery</text>
  <text x="750" y="107" class="cap" text-anchor="middle">Security baseline</text>
  <text x="880" y="107" class="cap" text-anchor="middle">High-risk AI</text>
  <line x1="30" y1="118" x2="930" y2="118" stroke="#1a3a6b" stroke-width="1.5"/>

  <!-- 1 MS -->
  <text x="30" y="168" class="pillar">1  Model Security</text>
  <text x="30" y="182" class="cap">MS-01 .. MS-11</text>
  <circle cx="230" cy="166" r="8" fill="#1a3a6b"/><circle cx="360" cy="166" r="8" fill="#d4a017"/><circle cx="490" cy="166" r="8" fill="#1a3a6b"/><circle cx="620" cy="166" r="8" fill="#d4a017"/><circle cx="750" cy="166" r="8" fill="#d4a017"/><circle cx="880" cy="166" r="8" fill="#1a3a6b"/>

  <!-- 2 IAM -->
  <text x="30" y="234" class="pillar">2  Identity &amp; Access</text>
  <text x="30" y="248" class="cap">IAM-01 .. IAM-09</text>
  <circle cx="230" cy="232" r="8" fill="#1a3a6b"/><circle cx="360" cy="232" r="8" fill="#1a3a6b"/><circle cx="490" cy="232" r="8" fill="#1a3a6b"/><circle cx="620" cy="232" r="8" fill="#d4a017"/><circle cx="750" cy="232" r="8" fill="#1a3a6b"/><circle cx="880" cy="232" r="8" fill="#d4a017"/>

  <!-- 3 DS -->
  <text x="30" y="300" class="pillar">3  Data Security</text>
  <text x="30" y="314" class="cap">DS-01 .. DS-07</text>
  <circle cx="230" cy="298" r="8" fill="#1a3a6b"/><circle cx="360" cy="298" r="8" fill="#1a3a6b"/><circle cx="490" cy="298" r="8" fill="#1a3a6b"/><circle cx="620" cy="298" r="8" fill="#d4a017"/><circle cx="750" cy="298" r="8" fill="#1a3a6b"/><circle cx="880" cy="298" r="8" fill="#d4a017"/>

  <!-- 4 TP -->
  <text x="30" y="366" class="pillar">4  Tool &amp; Pipeline Security</text>
  <text x="30" y="380" class="cap">TP-01 .. TP-12</text>
  <circle cx="230" cy="364" r="8" fill="#d4a017"/><circle cx="360" cy="364" r="8" fill="#1a3a6b"/><circle cx="490" cy="364" r="8" fill="#1a3a6b"/><circle cx="620" cy="364" r="8" fill="#d4a017"/><circle cx="750" cy="364" r="8" fill="#1a3a6b"/><circle cx="880" cy="364" r="8" fill="#d4a017"/>

  <!-- 5 MIR -->
  <text x="30" y="432" class="pillar">5  Monitoring &amp; IR</text>
  <text x="30" y="446" class="cap">MIR-01 .. MIR-06</text>
  <circle cx="230" cy="430" r="8" fill="#ef4444"/><circle cx="360" cy="430" r="8" fill="#1a3a6b"/><circle cx="490" cy="430" r="8" fill="#1a3a6b"/><circle cx="620" cy="430" r="8" fill="#ef4444"/><circle cx="750" cy="430" r="8" fill="#1a3a6b"/><circle cx="880" cy="430" r="8" fill="#d4a017"/>

  <!-- 6 GRM -->
  <text x="30" y="498" class="pillar">6  Governance &amp; Risk</text>
  <text x="30" y="512" class="cap">GRM-01 .. GRM-06</text>
  <circle cx="230" cy="496" r="8" fill="#1a3a6b"/><circle cx="360" cy="496" r="8" fill="#d4a017"/><circle cx="490" cy="496" r="8" fill="#1a3a6b"/><circle cx="620" cy="496" r="8" fill="#1a3a6b"/><circle cx="750" cy="496" r="8" fill="#d4a017"/><circle cx="880" cy="496" r="8" fill="#1a3a6b"/>

  <!-- 7 EE -->
  <text x="30" y="564" class="pillar">7  Execution Environment</text>
  <text x="30" y="578" class="cap">EE-01 .. EE-08</text>
  <circle cx="230" cy="562" r="8" fill="#d4a017"/><circle cx="360" cy="562" r="8" fill="#d4a017"/><circle cx="490" cy="562" r="8" fill="#1a3a6b"/><circle cx="620" cy="562" r="8" fill="#d4a017"/><circle cx="750" cy="562" r="8" fill="#1a3a6b"/><circle cx="880" cy="562" r="8" fill="#d4a017"/>

  <line x1="30" y1="592" x2="930" y2="592" stroke="#1a3a6b" stroke-width="1.5"/>
  <text x="30" y="610" class="note">Privacy Act APP 11: customer and loyalty data in prompts, logs, and training sets (DS, MS), with NDB 30-day breach notification (MIR-05, red). PCI DSS: cardholder data flowing through agent-facing payment and order tools (TP, DS). Cyber Security Act 2024: positive security obligations and ransomware reporting for businesses of national significance (GRM, MIR). SOCI Act: 12-hour incident reporting where the entity is sector-designated, food and grocery included (MIR-05, red). ISM/E8: the security baseline retail already runs. AU Guardrails: high-risk AI governance and transparency (GRM-05).</text>
</svg>
